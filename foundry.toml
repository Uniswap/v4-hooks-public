[profile.default]
out = 'foundry-out'
auto_detect_solc = true
optimizer_runs = 44444444
via_ir = false
ffi = true
fs_permissions = [{ access = "read-write", path = ".forge-snapshots/" }, { access = "read", path = "foundry-out/" }, { access = "read-write", path = "docs/" }, { access = "read", path = "test/stable/data/" }, { access = "read", path = "test/volatile/data/" }, { access = "read", path = "test/aggregator-hooks/StableSwapNG/precompiled/" }, { access = "read", path = "test/aggregator-hooks/StableSwap/precompiled/" }, { access = "read", path = "test/aggregator-hooks/UniswapV3/precompile/" }, { access = "read", path = "test/aggregator-hooks/PancakeSwapV3/precompile/" }, { access = "read", path = "test/aggregator-hooks/UniswapV2/precompile/" }]
evm_version = "cancun"
gas_limit = "3000000000"
bytecode_hash = "none"
# Emitted for CI's upgrade storage-layout validation (@openzeppelin/upgrades-core
# reads foundry-out/build-info); required by the UUPS StablePairHook.
ast = true
build_info = true
extra_output = ["storageLayout"]

[profile.debug]
via_ir = false
optimizer_runs = 200

[profile.gas]
gas_limit=30_000_000

[profile.aggregator_hooks]
via_ir = false
optimizer_runs = 200

[fuzz]
# Raised from 10: at 10 runs a property test is close to meaningless. Heavy suites
# (fork-bound, address mining, external integrations) opt back down with a
# `/// forge-config: default.fuzz.runs = N` annotation on the contract.
runs = 2048

[invariant]
runs = 256
depth = 32
fail_on_revert = true
shrink_run_limit = 1024

[rpc_endpoints]
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
unichain_sepolia = "https://sepolia.unichain.org"
base_sepolia = "https://sepolia.base.org"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
mainnet = "https://mainnet.infura.io/v3/${INFURA_API_KEY}"
tempo_testnet = "https://rpc.moderato.tempo.xyz"
tempo_mainnet = "https://rpc.tempo.xyz"

[lint]
lint_on_build=false
