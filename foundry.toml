[profile.default]
out = 'foundry-out'
auto_detect_solc = true
optimizer_runs = 200
via_ir = true
ffi = true
fs_permissions = [{ access = "read-write", path = ".forge-snapshots/" }, { access = "read", path = "foundry-out/" }, { access = "read-write", path = "docs/" }, { access = "read", path = "test/stable/data/" }, { access = "read", path = "test/aggregator-hooks/StableSwapNG/precompiled/" }, { access = "read", path = "test/aggregator-hooks/StableSwap/precompiled/" }]
evm_version = "cancun"
gas_limit = "3000000000"
bytecode_hash = "none"
# fluid-contracts-public uses inline assembly without memory-safe annotations,
# which prevents the via-ir Yul optimizer from reorganizing the stack and trips
# stack-too-deep in dexLite/adminModule/main.sol. Compile fluid with legacy
# codegen so the project default of via-ir keeps working for everything else.
additional_compiler_profiles = [
  { name = "fluid", via_ir = false, optimizer_runs = 200 }
]
compilation_restrictions = [
  { paths = "lib/fluid-contracts-public/**", via_ir = false }
]

[profile.debug]
via_ir = false
optimizer_runs = 200

[profile.gas]
gas_limit=30_000_000

[profile.aggregator_hooks]
via_ir = false
optimizer_runs = 200

[fuzz]
runs = 512

[invariant]
runs = 512
depth = 32
fail_on_revert = false
shrink_run_limit = 1024

[rpc_endpoints]
sepolia = "https://rpc.sepolia.org"
unichain_sepolia = "https://sepolia.unichain.org"
base_sepolia = "https://sepolia.base.org"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
mainnet = "https://mainnet.infura.io/v3/${INFURA_API_KEY}"
tempo_testnet = "https://rpc.moderato.tempo.xyz"
tempo_mainnet = "https://rpc.tempo.xyz"

[lint]
lint_on_build=false
