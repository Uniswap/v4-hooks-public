name: test

on:
  # No branch filter: stacked PRs target long-lived integration branches (e.g. `public`),
  # and a filtered list silently skips the whole test job for them while the PR shows green.
  pull_request:
  push:
    branches: [main, master, staging, dev, public]

env:
  FOUNDRY_PROFILE: ${{ github.event_name == 'push' && 'ci' || 'pr' }}

permissions: {}

jobs:
  forge-test:
    permissions:
      contents: read
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: bullfrogsec/bullfrog@dcde5841b19b7ef693224207a7fdec67fce604db # v0.8.3
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable

      # upgrades-core (the storage-layout validator below) must come from the committed lockfile
      - name: Install npm dependencies (lockfile-pinned)
        run: npm ci --ignore-scripts

      - name: Run Forge build
        run: |
          echo Foundry profile: $FOUNDRY_PROFILE
          forge --version
          forge build
        id: build

      # Checks that a new hook implementation's storage layout is upgrade-safe - the one
      # rule `_validateNewImplementation` can't check on-chain. Must run right after the
      # full `forge build`: later commands (`--sizes`, `forge test`) recompile subsets and
      # add partial build-info files, which the validator rejects.
      - name: Validate upgrade storage layout
        run: |
          npx --no-install @openzeppelin/upgrades-core validate foundry-out/build-info --contract StablePairHookV2Mock --reference StablePairHook --unsafeAllow constructor,state-variable-immutable,missing-initializer
        id: validate-upgrades

      # Negative control for the step above: StablePairHookBadV2Mock has a known-incompatible
      # layout (a field inserted, not appended, into V1's namespace), so the validator MUST
      # reject it. If this step fails, nothing is wrong with the mock - the validation
      # pipeline itself has stopped catching bad layouts (flag creep, tool regression).
      - name: Verify layout validation rejects an incompatible upgrade
        run: |
          if OUTPUT=$(npx --no-install @openzeppelin/upgrades-core validate foundry-out/build-info --contract StablePairHookBadV2Mock --reference StablePairHook --unsafeAllow constructor,state-variable-immutable,missing-initializer 2>&1); then
            echo "ERROR: upgrades-core accepted StablePairHookBadV2Mock, whose layout is known-incompatible."
            exit 1
          fi
          # It must fail WITH the mock's planted layout error: a renamed/missing mock also exits
          # nonzero, which would leave this control passing while proving nothing.
          echo "$OUTPUT" | grep -q 'Inserted `inserted`' || {
            echo "ERROR: validate failed, but not with the known layout incompatibility:"
            echo "$OUTPUT"
            exit 1
          }
        id: validate-upgrades-negative

      - name: Check contract sizes
        run: forge build --sizes src/*
        id: sizes

      - name: Run Forge tests
        run: forge test --isolate -vvv
        id: test
        env:
          FORGE_SNAPSHOT_CHECK: true

  forge-test-alf:
    permissions:
      contents: read
    strategy:
      fail-fast: true

    name: Foundry project (alf)
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: alf
    steps:
      - uses: bullfrogsec/bullfrog@dcde5841b19b7ef693224207a7fdec67fce604db # v0.8.3
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: stable

      - name: Run Forge build
        run: |
          echo Foundry profile: $FOUNDRY_PROFILE
          forge --version
          forge build
        id: build

      - name: Run Forge tests
        run: forge test --isolate -vvv --match-path 'test/alf/*'
        id: test
        env:
          FORGE_SNAPSHOT_CHECK: true
