# AI PR review using @uniswap/review-cli (private GitHub Packages).
#
# Derived from the upstream template
# (packages/review-cli/templates/workflows/review.yml in
# Uniswap/internal-tools) and matched to the shape used by
# Uniswap/backend and Uniswap/universe.
#
# Replaces the previous .github/workflows/claude-code-review.yml, which
# called the ai-toolkit reusable review workflow.
#
# Three triggers, two jobs:
#
#   pull_request                ┐
#   issue_comment               ├──▶  triage (gate)  ──gated by──▶  review
#   pull_request_review_comment ┘
#
# All gate / trigger-phrase / reaction logic lives in the cli
# (`review-cli triage` and `review-cli react`). This file is a thin
# adapter: it installs the cli, then hands off. No
# `${{ github.event.* }}` interpolation into bash — that is a command
# injection vector when the field is user-controlled (comment body,
# branch name). The cli reads those values as data from
# GITHUB_EVENT_PATH, never as shell tokens.

name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  # Only pull_request events cancel in-progress runs. A re-push SHOULD
  # supersede the previous review (no point reviewing stale code), but a
  # third-party bot comment must not kill an in-flight push review.
  #
  # Every skip clause on the triage job's `if:` is mirrored here, and the
  # two MUST stay in sync: concurrency is evaluated when the run is created,
  # before any job `if:`. A push this predicate accepts but triage then
  # skips (draft, fork, bot author, release/ or dependabot/ branch, ...)
  # would cancel a review a human asked for by comment and replace it with
  # nothing — the commenter is left with a "cancelled, newer push" reply and
  # no review. Cancel only for pushes that will produce a replacement.
  # Folded scalar: every continuation line sits at the same indent so YAML
  # collapses this to ONE line before Actions parses the expression.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
    && !github.event.pull_request.draft
    && !github.event.pull_request.head.repo.fork
    && !endsWith(github.event.pull_request.user.login, '[bot]')
    && github.event.pull_request.user.login != 'github-actions'
    && !startsWith(github.head_ref, 'gh-readonly-queue/')
    && !startsWith(github.head_ref, 'graphite-base/')
    && !startsWith(github.head_ref, 'release/')
    && !startsWith(github.head_ref, 'changeset-release/')
    && !startsWith(github.head_ref, 'cherry-pick/')
    && !startsWith(github.head_ref, 'dependabot/')
    && !startsWith(github.head_ref, 'renovate/') }}

# Permissions are scoped per-job — workflow-level permissions trip
# zizmor's excessive-permissions rule. Only the review job needs
# contents:write, and only for the resolveReviewThread GraphQL mutation.

# Single source for the CLI version, inherited by every step in both jobs.
# vars.REVIEW_CLI_VERSION is the authoritative pin — set it in repo settings
# to roll forward without a commit. The fallback matches the version
# Uniswap/universe currently runs. Defined once here so the two install
# blocks below cannot drift onto different versions.
env:
  REVIEW_CLI_VERSION: ${{ vars.REVIEW_CLI_VERSION || '1.10.7' }}
  # ── Pinned Claude Code version — BUMP IT HERE, nowhere else ─────────
  # The install step downloads this exact release binary and verifies its
  # SHA256 against the release's GPG-signed manifest before anything
  # executes it. Without the pin, `curl | bash`
  # executes whatever upstream serves at that moment — every other
  # third-party input to this workflow is SHA-pinned, so this one
  # shouldn't be the exception. vars.CLAUDE_CODE_VERSION overrides
  # without a commit. Released versions:
  # https://www.npmjs.com/package/@anthropic-ai/claude-code?activeTab=versions
  CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || '2.1.222' }}
  # Fingerprint of the Anthropic Claude Code release signing key. Fixed
  # across releases; published at
  # https://code.claude.com/docs/en/setup#binary-integrity-and-code-signing
  CLAUDE_CODE_GPG_FINGERPRINT: '31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE'
  # Native installs auto-update in the background. A pin that silently
  # updates itself mid-job is not a pin.
  DISABLE_AUTOUPDATER: '1'
  # Also switches off telemetry, error reporting and the update check, so
  # the only outbound traffic from the binary is the model API. Keeps the
  # Bullfrog egress log to what the job actually needs.
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'

jobs:
  triage:
    name: Triage
    runs-on: ubuntu-latest
    # Event-level gate. The branch-prefix and bot-author skips mirror
    # review-cli's built-in defaults (config.ts `skip`) and have to live
    # here: the triage step below runs with `--skip-config`, which loads
    # no policy at all, so only its draft check would otherwise apply.
    # Comment triggers deliberately bypass those skips (a human asked).
    # Every clause added here must also be added to `cancel-in-progress`
    # at the top of this file, or a skipped push cancels a comment-
    # triggered review and nothing replaces it.
    # This `if:` is also the trust boundary for comment triggers: only OWNER / MEMBER /
    # COLLABORATOR comments can start a run. That matters because the
    # review job checks out PR head code in a job holding an LLM
    # credential, so an outside contributor must not be able to trigger
    # it by commenting.
    if: |
      (github.event_name == 'pull_request'
        && !github.event.pull_request.draft
        && !github.event.pull_request.head.repo.fork
        && !endsWith(github.event.pull_request.user.login, '[bot]')
        && github.event.pull_request.user.login != 'github-actions'
        && !startsWith(github.head_ref, 'gh-readonly-queue/')
        && !startsWith(github.head_ref, 'graphite-base/')
        && !startsWith(github.head_ref, 'release/')
        && !startsWith(github.head_ref, 'changeset-release/')
        && !startsWith(github.head_ref, 'cherry-pick/')
        && !startsWith(github.head_ref, 'dependabot/')
        && !startsWith(github.head_ref, 'renovate/')) ||
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && contains(github.event.comment.body, '@request-claude-review')
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@request-claude-review')
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read           # baseline; this job performs no checkout
      packages: read           # pull @uniswap/review-cli from GH Packages
      issues: write            # 👀 reaction on issue_comment
      pull-requests: write     # 👀 reaction on pull_request_review_comment
    outputs:
      run: ${{ steps.gate.outputs.run }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      comment_id: ${{ steps.gate.outputs.comment_id }}
      trigger_source: ${{ steps.gate.outputs.trigger_source }}
      note: ${{ steps.gate.outputs.note }}
      commenter: ${{ steps.gate.outputs.commenter }}
      thread_anchor: ${{ steps.gate.outputs.thread_anchor }}
      reply_id: ${{ steps.post_reply.outputs.id }}
    steps:
      # Egress monitor. Must be the first step of the job or it cannot see
      # the requests made before it started. Audit mode: every outbound
      # connection is listed in the job summary without being blocked; that
      # list is the input for switching this to `egress-policy: block`.
      - uses: bullfrogsec/bullfrog@1831f79cce8ad602eef14d2163873f27081ebfb3 # v0.8.4
        with:
          egress-policy: audit

      # Install the CLI with NO repo content on disk — this job performs no
      # checkout at all, so nothing PR-author-controlled can influence
      # dependency resolution. (An earlier revision checked out the repo here
      # to use a local composite action; on `pull_request` events a bare
      # checkout resolves to `refs/pull/N/merge`, i.e. the PR author's tree,
      # which defeated the point.)
      #
      # review-cli is published only to GitHub Packages, so the @uniswap scope
      # must be routed there. Bun supports per-scope but not per-package
      # registry overrides, so the install runs from a scratch directory with
      # its own bunfig rather than adding one to this repo. BUN_CONFIG_FILE is
      # set explicitly so the install cannot be steered by a bunfig.toml
      # anywhere else on disk.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - name: Install review-cli
        id: install
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/review-cli-install"
          mkdir -p "$install_dir"
          cat > "$install_dir/bunfig.toml" <<EOF
          [install.scopes]
          "@uniswap" = { url = "https://npm.pkg.github.com", token = "$GH_PACKAGES_TOKEN" }
          EOF
          # The bunfig holds GITHUB_TOKEN in cleartext and is only needed until
          # the package resolves. Remove it on every exit path — a failed
          # `bun add` must not leave it under $RUNNER_TEMP either.
          trap 'rm -f "$install_dir/bunfig.toml" "$RUNNER_TEMP/bun-add.err"' EXIT
          cd "$install_dir"
          export BUN_CONFIG_FILE="$install_dir/bunfig.toml"
          bun init -y > /dev/null
          if ! bun add "@uniswap/review-cli@${REVIEW_CLI_VERSION}" 2> "$RUNNER_TEMP/bun-add.err"; then
            cat "$RUNNER_TEMP/bun-add.err" >&2
            if grep -qE '(^|[^0-9])403([^0-9]|$)' "$RUNNER_TEMP/bun-add.err"; then
              echo "::error::403 from GitHub Packages. $GITHUB_REPOSITORY has no read access to @uniswap/review-cli. Fix: Uniswap/internal-tools -> Packages -> review-cli -> Package settings -> Manage Actions access -> add this repository. This is a per-repo grant; no workflow change can confer it."
            fi
            exit 1
          fi
          echo "bin=$install_dir/node_modules/.bin/review-cli" >> "$GITHUB_OUTPUT"

      # Gate — reads GITHUB_EVENT_NAME + GITHUB_EVENT_PATH itself and
      # writes the decision to GITHUB_OUTPUT. `--skip-config` because this
      # job never checks out the repo, so no `.claude/review.yml` is on
      # disk to read. With that flag the cli applies only its draft check;
      # the branch and author skips are enforced by the job `if:` above.
      - name: Decide whether to run
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_CLI: ${{ steps.install.outputs.bin }}
        run: '"$REVIEW_CLI" triage --from-github-actions --skip-config'

      - name: Acknowledge comment trigger (👀)
        if: |
          steps.gate.outputs.run == 'true' &&
          steps.gate.outputs.comment_id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMENT_ID: ${{ steps.gate.outputs.comment_id }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_CLI: ${{ steps.install.outputs.bin }}
        run: |
          "$REVIEW_CLI" react \
            --repo "$GH_REPO" \
            --comment-id "$COMMENT_ID" \
            --event "$EVENT_NAME" \
            --reaction ack

      # A visible "working on it" reply under the trigger comment. The
      # 👀 is glanceable; this carries the run URL. Best-effort.
      - name: Post running-state reply
        id: post_reply
        if: |
          steps.gate.outputs.run == 'true' &&
          steps.gate.outputs.comment_id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          COMMENT_ID: ${{ steps.gate.outputs.comment_id }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_CLI: ${{ steps.install.outputs.bin }}
          REPLY_BODY: |
            ↻ **Reviewing now** · [view run ↗](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            This comment will update when the review completes. Findings will appear in the sticky summary above.
        run: |
          OUT="$RUNNER_TEMP/reply-id.txt"
          "$REVIEW_CLI" reply \
            --repo "$GH_REPO" \
            --pr "$PR_NUMBER" \
            --event "$EVENT_NAME" \
            --in-reply-to "$COMMENT_ID" \
            --body "$REPLY_BODY" \
            --out-id "$OUT"
          if [ -s "$OUT" ]; then
            echo "id=$(cat "$OUT")" >> "$GITHUB_OUTPUT"
          fi

  review:
    name: AI review
    needs: triage
    if: needs.triage.outputs.run == 'true'
    runs-on: ubuntu-latest
    # contents:write (not read) is required for the resolveReviewThread
    # GraphQL mutation; pull-requests:write alone returns "Resource not
    # accessible by integration".
    # https://github.com/orgs/community/discussions/44650
    permissions:
      contents: write
      packages: read
      pull-requests: write
      issues: write
    timeout-minutes: 30
    steps:
      # Egress monitor. Must be the first step of the job or it cannot see
      # the requests made before it started. Audit mode: every outbound
      # connection is listed in the job summary without being blocked; that
      # list is the input for switching this to `egress-policy: block`.
      - uses: bullfrogsec/bullfrog@1831f79cce8ad602eef14d2163873f27081ebfb3 # v0.8.4
        with:
          egress-policy: audit

      # Install the CLI FIRST — before anything but the egress monitor
      # above — for two
      # independent reasons:
      #
      # 1. No PR-author-controlled content is on disk yet (the only
      #    checkout is further down), so dependency resolution cannot be
      #    steered by the PR. (An earlier revision checked out the repo
      #    here to use a local composite action; on `pull_request` events
      #    a bare checkout resolves to `refs/pull/N/merge`, i.e. the PR
      #    author's tree, which defeated the point.)
      # 2. The finalization steps at the bottom of this job (reaction +
      #    threaded-reply updates) run on every terminal state (two are
      #    gated `!cancelled()`, the third `cancelled()`) and need
      #    `steps.install.outputs.bin` to report that state.
      #    If install ran after "Validate PR number" / "Refuse fork PRs"
      #    and one of those failed first, `steps.install.outputs.bin`
      #    would be empty, those finalization steps would silently no-op
      #    under `continue-on-error: true`, and a rejected trigger comment
      #    would keep its 👀 and "Reviewing now" reply forever — indistinguishable
      #    from a hung review.
      #
      # review-cli is published only to GitHub Packages, so the @uniswap scope
      # must be routed there. Bun supports per-scope but not per-package
      # registry overrides, so the install runs from a scratch directory with
      # its own bunfig rather than adding one to this repo. BUN_CONFIG_FILE is
      # set explicitly so the install cannot be steered by a bunfig.toml
      # anywhere else on disk.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - name: Install review-cli
        id: install
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/review-cli-install"
          mkdir -p "$install_dir"
          cat > "$install_dir/bunfig.toml" <<EOF
          [install.scopes]
          "@uniswap" = { url = "https://npm.pkg.github.com", token = "$GH_PACKAGES_TOKEN" }
          EOF
          # The bunfig holds GITHUB_TOKEN in cleartext and is only needed until
          # the package resolves. Remove it on every exit path — a failed
          # `bun add` must not leave it under $RUNNER_TEMP either.
          trap 'rm -f "$install_dir/bunfig.toml" "$RUNNER_TEMP/bun-add.err"' EXIT
          cd "$install_dir"
          export BUN_CONFIG_FILE="$install_dir/bunfig.toml"
          bun init -y > /dev/null
          if ! bun add "@uniswap/review-cli@${REVIEW_CLI_VERSION}" 2> "$RUNNER_TEMP/bun-add.err"; then
            cat "$RUNNER_TEMP/bun-add.err" >&2
            if grep -qE '(^|[^0-9])403([^0-9]|$)' "$RUNNER_TEMP/bun-add.err"; then
              echo "::error::403 from GitHub Packages. $GITHUB_REPOSITORY has no read access to @uniswap/review-cli. Fix: Uniswap/internal-tools -> Packages -> review-cli -> Package settings -> Manage Actions access -> add this repository. This is a per-repo grant; no workflow change can confer it."
            fi
            exit 1
          fi
          echo "bin=$install_dir/node_modules/.bin/review-cli" >> "$GITHUB_OUTPUT"

      # Defense in depth for the `ref:` on the PR-head checkout below.
      # pr_number originates from an integer field in the GitHub event
      # payload, but it reaches this job as a string job output, so
      # assert it is digits before it can reach actions/checkout as a
      # ref fragment.
      - name: Validate PR number
        env:
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
        run: |
          case "$PR_NUMBER" in
            '' | *[!0-9]*)
              echo "::error::Refusing to proceed: pr_number is not numeric."
              exit 1
              ;;
          esac
          echo "pr_number validated: $PR_NUMBER"

      # Fork guard for the comment-trigger path. The job-level `if:` blocks
      # fork `pull_request` events, but `issue_comment` and
      # `pull_request_review_comment` payloads carry no head-repo field, so
      # that condition cannot express this case — and those two events run
      # the base-ref workflow *with* repository secrets. Without this, a
      # MEMBER commenting the trigger phrase on a fork PR would reach the
      # `refs/pull/N/head` checkout below in a job holding contents: write
      # and the LLM credential, and review-cli reads `.claude/` from the
      # checked-out tree as agent policy. That is the Cantina #655 shape;
      # resolve the head repo over the API and fail closed before any fork
      # content is on disk.
      - name: Refuse fork PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
        run: |
          set -euo pipefail
          HEAD_REPO=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.repo.full_name')
          if [ "$HEAD_REPO" != "$GH_REPO" ]; then
            echo "::error::Refusing to review a fork PR (head=$HEAD_REPO). Fork code must not run in a job holding repository secrets."
            exit 1
          fi
          echo "same-repo PR confirmed (head=$HEAD_REPO)"

      - name: Verify an LLM credential is present
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No LLM credential. Set CLAUDE_CODE_OAUTH_TOKEN (preferred) or ANTHROPIC_API_KEY as a repo secret."
            exit 1
          fi

      # Claude Code is fetched as a bare release binary and verified against
      # the release's GPG-signed manifest BEFORE anything executes. Earlier
      # revisions piped https://claude.ai/install.sh into bash first and
      # verified the binary it produced; that left the one unpinned, unsigned
      # executable in the chain running before any check, in a job holding
      # the LLM credential. Nothing here runs until the checksum matches.
      # (The bun SDK's optional-dep binary is not used: bun on Linux extracts
      # only the host variant while the SDK probes the musl path first.)
      - name: Install Claude Code binary
        run: |
          set -euo pipefail

          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) PLATFORM='linux-x64' ;;
            Linux/aarch64 | Linux/arm64) PLATFORM='linux-arm64' ;;
            *)
              echo "::error::No release-manifest platform key for $(uname -s)/$(uname -m). This template assumes a Linux runner; add a case here if you changed runs-on."
              exit 1
              ;;
          esac

          RELEASES='https://downloads.claude.ai/claude-code-releases'
          WORK="$(mktemp -d)"
          curl -fsSL "$RELEASES/$CLAUDE_CODE_VERSION/manifest.json" -o "$WORK/manifest.json"
          curl -fsSL "$RELEASES/$CLAUDE_CODE_VERSION/manifest.json.sig" -o "$WORK/manifest.json.sig"

          # The manifest lists a SHA256 for every platform binary and is itself
          # GPG-signed, so a good signature on the manifest transitively covers
          # the binary. Import into a throwaway keyring, assert the KEY
          # FINGERPRINT, then require the signature itself to come from that
          # key: `gpg --verify` alone accepts a valid signature from ANY key in
          # the keyring, so a poisoned key bundle would pass the fingerprint
          # check and then sign a tampered manifest. VALIDSIG lists the signing
          # key first and the primary key last.
          export GNUPGHOME="$WORK/gnupg"
          mkdir -m 0700 "$GNUPGHOME"
          curl -fsSL https://downloads.claude.ai/keys/claude-code.asc | gpg --batch --quiet --import
          if ! gpg --batch --with-colons --fingerprint security@anthropic.com \
            | grep -q "^fpr:.*:${CLAUDE_CODE_GPG_FINGERPRINT}:"; then
            echo "::error::Claude Code release signing key does not match the pinned fingerprint $CLAUDE_CODE_GPG_FINGERPRINT"
            exit 1
          fi
          if ! gpg --batch --status-fd 1 --verify "$WORK/manifest.json.sig" "$WORK/manifest.json" \
            | grep -qE "^\[GNUPG:\] VALIDSIG (${CLAUDE_CODE_GPG_FINGERPRINT} |.* ${CLAUDE_CODE_GPG_FINGERPRINT}$)"; then
            echo "::error::manifest.json signature was not made by the pinned key $CLAUDE_CODE_GPG_FINGERPRINT"
            exit 1
          fi

          EXPECTED="$(jq -r --arg p "$PLATFORM" '.platforms[$p].checksum // empty' "$WORK/manifest.json")"
          if [ -z "$EXPECTED" ]; then
            echo "::error::manifest.json for $CLAUDE_CODE_VERSION lists no checksum for $PLATFORM"
            exit 1
          fi

          # Same URL the official installer downloads from, verified against
          # the signed manifest before it is made executable.
          curl -fsSL "$RELEASES/$CLAUDE_CODE_VERSION/$PLATFORM/claude" -o "$WORK/claude"
          ACTUAL="$(sha256sum "$WORK/claude" | cut -d' ' -f1)"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Claude Code $CLAUDE_CODE_VERSION checksum mismatch for $PLATFORM (expected $EXPECTED, got $ACTUAL). The download does not match the signed manifest; do not work around this by changing the version pin."
            exit 1
          fi
          CLAUDE_DIR="$RUNNER_TEMP/claude-code"
          mkdir -p "$CLAUDE_DIR"
          install -m 0755 "$WORK/claude" "$CLAUDE_DIR/claude"
          rm -rf "$WORK"
          echo "Verified Claude Code $CLAUDE_CODE_VERSION ($PLATFORM) against the signed release manifest."

          # Point the SDK at the binary we actually verified.
          echo "CLAUDE_CODE_EXECUTABLE_PATH=$CLAUDE_DIR/claude" >> "$GITHUB_ENV"
          echo "$CLAUDE_DIR" >> "$GITHUB_PATH"

      # The ONLY checkout in this workflow, and it is explicitly pinned to
      # the PR head rather than left to default. Everything from here runs
      # with untrusted files in the working directory, so every subsequent
      # step that invokes bun sets BUN_CONFIG_FILE=/dev/null: bun
      # auto-loads ./bunfig.toml from CWD and executes its `preload` array
      # in-process. The install above already completed against its own
      # pinned bunfig, before any of this was on disk.
      - name: Checkout PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/pull/${{ needs.triage.outputs.pr_number }}/head

      # Reviewers read dependencies under lib/ (Foundry submodules), which a
      # plain checkout leaves empty. Two guards, because `.gitmodules` in the
      # PR head is PR-author-controlled and a recursive init would otherwise
      # fetch whatever URLs it names: (1) fetch only when the PR's
      # `.gitmodules` is byte-identical to the default branch's, so a PR
      # cannot redirect a submodule; (2) allow only the https transport, so
      # file://, ext::, git:// and ssh URLs in any nested `.gitmodules` are
      # refused rather than fetched. Best effort on purpose: no credentials
      # are persisted, so a private submodule warns instead of failing the
      # review, and `continue-on-error` keeps a timeout kill from failing it
      # either. A no-op in repos without submodules.
      - name: Fetch submodules (best effort)
        timeout-minutes: 10
        continue-on-error: true
        env:
          GIT_TERMINAL_PROMPT: '0'
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          [ -f .gitmodules ] || { echo "No .gitmodules; nothing to fetch."; exit 0; }
          if ! git diff --quiet "origin/$DEFAULT_BRANCH" -- .gitmodules; then
            echo "::warning::.gitmodules differs from $DEFAULT_BRANCH (or that branch was not fetched); skipping the submodule fetch so no PR-controlled URL is fetched. Reviewers will see an incomplete lib/"
            exit 0
          fi
          git -c protocol.allow=never -c protocol.https.allow=always \
            submodule update --init --recursive --depth 1 \
            || echo "::warning::Some submodules could not be fetched; reviewers will see an incomplete lib/"

      - name: Pre — running sticky placeholder
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
          REVIEW_CLI: ${{ steps.install.outputs.bin }}
          BUN_CONFIG_FILE: /dev/null
        run: '"$REVIEW_CLI" post "$PR_NUMBER" --repo "$GH_REPO" --pre'

      # Analyze. Trigger context flows in via env vars (never shell
      # interpolation) so a malicious comment body cannot break out.
      - name: Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_NOTE: ${{ needs.triage.outputs.note }}
          REVIEW_TRIGGER_SOURCE: ${{ needs.triage.outputs.trigger_source }}
          REVIEW_COMMENTER: ${{ needs.triage.outputs.commenter }}
          REVIEW_THREAD_ANCHOR: ${{ needs.triage.outputs.thread_anchor }}
          # Pin the artifact paths so the upload steps below can read
          # them back; the cli default is ./ which would land inside the
          # PR checkout.
          REVIEW_CLI_ARTIFACT_PATH: ${{ runner.temp }}/review-cli-output.json
          REVIEW_CLI_TOKENS_ARTIFACT_PATH: ${{ runner.temp }}/agent-tokens.jsonl
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
          REVIEW_CLI: ${{ steps.install.outputs.bin }}
          BUN_CONFIG_FILE: /dev/null
        run: |
          "$REVIEW_CLI" review "$PR_NUMBER" \
            --repo "$GH_REPO" \
            --trigger-source "$REVIEW_TRIGGER_SOURCE" \
            ${REVIEW_NOTE:+--note "$REVIEW_NOTE"} \
            ${REVIEW_COMMENTER:+--commenter "$REVIEW_COMMENTER"} \
            ${REVIEW_THREAD_ANCHOR:+--thread-anchor "$REVIEW_THREAD_ANCHOR"} \
            --live

      - name: Post
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.triage.outputs.pr_number }}
          REVIEW_CLI: ${{ steps.install.outputs.bin }}
          BUN_CONFIG_FILE: /dev/null
        run: '"$REVIEW_CLI" post "$PR_NUMBER" --repo "$GH_REPO"'

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-cli-run-${{ needs.triage.outputs.pr_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-cli-output.json
          if-no-files-found: warn
          retention-days: 30

      # Name MUST be exactly `agent-tokens` so the agent-scorecard
      # aggregator finds it across consumer repos.
      - name: Upload agent-tokens artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-tokens
          path: ${{ runner.temp }}/agent-tokens.jsonl
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

      - name: Update reaction (👍 / 👎) on comment trigger
        # `!cancelled()` runs on success and failure but not cancellation,
        # which is what we want: a cancelled run is not a failed one, so
        # leaving the 👀 in place is accurate rather than overwriting it with
        # 👎 and telling the commenter their request broke.
        #
        # Gated by the status-check function, NOT by comparing `job.status`
        # in bash. `job.status` is documented to be one of success / failure
        # / cancelled, but nothing specifies that it interpolates to
        # `cancelled` for a step of the job currently being cancelled, so a
        # bash comparison against it is an unverified assumption.
        if: |
          !cancelled() &&
          needs.triage.outputs.comment_id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ job.status }}
          GH_REPO: ${{ github.repository }}
          COMMENT_ID: ${{ needs.triage.outputs.comment_id }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_CLI: ${{ steps.install.outputs.bin }}
          BUN_CONFIG_FILE: /dev/null
        run: |
          REACTION=$([ "$OUTCOME" = "success" ] && echo "success" || echo "failure")
          "$REVIEW_CLI" react \
            --repo "$GH_REPO" \
            --comment-id "$COMMENT_ID" \
            --event "$EVENT_NAME" \
            --reaction "$REACTION" \
            --clear-prior-ack

      - name: Update threaded reply with terminal state
        # Success and failure only. Cancellation is the next step, gated on
        # `cancelled()` — see the note there.
        if: |
          !cancelled() &&
          needs.triage.outputs.reply_id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ job.status }}
          GH_REPO: ${{ github.repository }}
          REPLY_ID: ${{ needs.triage.outputs.reply_id }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_CLI: ${{ steps.install.outputs.bin }}
          BUN_CONFIG_FILE: /dev/null
        run: |
          if [ "$OUTCOME" = "success" ]; then
            BODY="✅ **Reviewed** · [view run ↗](${RUN_URL}) · scroll up for the full summary."
          else
            BODY="⚠ **Review failed** · [view run ↗](${RUN_URL}) · scroll up for the partial state, or comment \`@request-claude-review\` to retry."
          fi
          "$REVIEW_CLI" reply \
            --repo "$GH_REPO" \
            --event "$EVENT_NAME" \
            --edit-reply "$REPLY_ID" \
            --body "$BODY"

      - name: Update threaded reply when the run is cancelled
        # Cancellation is a third terminal state, not a flavour of failure.
        # It gets its own step because `cancelled()` is the only documented
        # way to detect it; the previous version branched on `job.status`
        # inside the step above, which may never have matched.
        #
        # The copy reports the observable fact and hedges the cause: a
        # manual cancel from the Actions UI produces the same state with no
        # newer review behind it, so asserting a supersede would be stating
        # a cause we cannot know. The retry hint matters most here, because
        # on that path nothing else is coming.
        if: |
          cancelled() &&
          needs.triage.outputs.reply_id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPLY_ID: ${{ needs.triage.outputs.reply_id }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_CLI: ${{ steps.install.outputs.bin }}
          BUN_CONFIG_FILE: /dev/null
        run: |
          # Cancellation can land before the install step finished, in which
          # case there is no binary to post with. Exit clean rather than
          # failing a step whose whole job is already cancelled.
          if [ -z "${REVIEW_CLI:-}" ] || [ ! -x "$REVIEW_CLI" ]; then
            echo "review-cli not installed (cancelled early); leaving the reply as-is"
            exit 0
          fi
          BODY="⏹ **Cancelled** · this run was cancelled before finishing — most often because a newer push to this PR started a fresh review · [view run ↗](${RUN_URL}) · comment \`@request-claude-review\` if you still need one."
          "$REVIEW_CLI" reply \
            --repo "$GH_REPO" \
            --event "$EVENT_NAME" \
            --edit-reply "$REPLY_ID" \
            --body "$BODY"
